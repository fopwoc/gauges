name: gauges

services:
  gauges:
    build:
      context: .
    restart: unless-stopped
    environment:
      GAUGES_HOST: 0.0.0.0
      GAUGES_PORT: 8080
      GAUGES_DATABASE_PATH: /data/gauges.redb
      GAUGES_DEVICES_JSON: "${GAUGES_DEVICES_JSON:?Copy .env.example to .env and configure device tokens}"
      GAUGES_CLEANUP_INTERVAL_SECONDS: "${GAUGES_CLEANUP_INTERVAL_SECONDS:-60}"
      GAUGES_ONLINE_THRESHOLD_SECONDS: "${GAUGES_ONLINE_THRESHOLD_SECONDS:-30}"
      GAUGES_MAX_INGEST_BATCH_SIZE: "1000"
    ports:
      - "${GAUGES_HUB_PORT:-8080}:8080"
    volumes:
      - gauges-data:/data

volumes:
  gauges-data:
