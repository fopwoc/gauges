name: gauges

services:
  hub:
    build:
      context: .
    restart: unless-stopped
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_PATH: /data/gauges.redb
      DEVICES_JSON: "${DEVICES_JSON:?Copy .env.example to .env and configure device tokens}"
      CLEANUP_INTERVAL_SECONDS: "${CLEANUP_INTERVAL_SECONDS:-60}"
      ONLINE_THRESHOLD_SECONDS: "${ONLINE_THRESHOLD_SECONDS:-30}"
      MAX_INGEST_BATCH_SIZE: "1000"
      LOG_LEVEL: "${LOG_LEVEL:-error}"
    ports:
      - "${HUB_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data

volumes:
  data:
