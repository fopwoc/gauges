name: gauges-local

# Self-contained development stack. Credentials here are intentionally fixed
# and ports bind only to loopback; do not use this file as a LAN deployment.
services:
  hub:
    build:
      context: .
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_PATH: /data/gauges.redb
      DEVICES_JSON: '[{"id":"local-probe","name":"Local Docker Probe","token":"local-development-token"},{"id":"local-probe-2","name":"Local Docker Probe 2","token":"local-development-token-2"}]'
      CLEANUP_INTERVAL_SECONDS: "${CLEANUP_INTERVAL_SECONDS:-60}"
      ONLINE_THRESHOLD_SECONDS: "${ONLINE_THRESHOLD_SECONDS:-15}"
      MAX_INGEST_BATCH_SIZE: "1000"
      LOG_LEVEL: "${LOG_LEVEL:-error}"
    ports:
      - "127.0.0.1:${HUB_HTTP_PORT:-8080}:8080"
    volumes:
      - hub-data:/data

  probe:
    build:
      context: .
      dockerfile: probe/Dockerfile
    depends_on:
      hub:
        condition: service_healthy
    environment:
      DEVICE_ID: local-probe
      TOKEN: local-development-token
      HUB_URL: http://hub:8080
      DATABASE_PATH: /var/lib/gauges/probe.redb
      COLLECTION_INTERVAL_SECONDS: "${PROBE_COLLECTION_INTERVAL_SECONDS:-2}"
      RETRY_INTERVAL_SECONDS: "${PROBE_RETRY_INTERVAL_SECONDS:-5}"
      REQUEST_TIMEOUT_SECONDS: "${PROBE_REQUEST_TIMEOUT_SECONDS:-5}"
      RETENTION_HOURS: "${PROBE_RETENTION_HOURS:-24}"
      # Docker interfaces are virtual by definition. Include eth0 here so the
      # local dashboard exercises network metrics as well as the other fields.
      PHYSICAL_NETWORKS_ONLY: "false"
      LOG_LEVEL: "${LOG_LEVEL:-error}"
    volumes:
      - probe-data:/var/lib/gauges

  # Optional second probe for exercising the multi-machine accordion locally:
  # docker compose -f compose.local.yaml --profile multi up --build
  probe-2:
    profiles: [multi]
    build:
      context: .
      dockerfile: probe/Dockerfile
    depends_on:
      hub:
        condition: service_healthy
    environment:
      DEVICE_ID: local-probe-2
      TOKEN: local-development-token-2
      HUB_URL: http://hub:8080
      DATABASE_PATH: /var/lib/gauges/probe.redb
      COLLECTION_INTERVAL_SECONDS: "${PROBE_2_COLLECTION_INTERVAL_SECONDS:-2}"
      RETRY_INTERVAL_SECONDS: "${PROBE_RETRY_INTERVAL_SECONDS:-5}"
      REQUEST_TIMEOUT_SECONDS: "${PROBE_REQUEST_TIMEOUT_SECONDS:-5}"
      RETENTION_HOURS: "${PROBE_2_RETENTION_HOURS:-24}"
      PHYSICAL_NETWORKS_ONLY: "false"
      LOG_LEVEL: "${LOG_LEVEL:-error}"
    volumes:
      - probe-2-data:/var/lib/gauges

volumes:
  hub-data:
  probe-data:
  probe-2-data:
