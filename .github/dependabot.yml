version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      console-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /probe
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
