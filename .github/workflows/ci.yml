name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - COPYRIGHT
      - AI_USAGE.md
      - .github/assets/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - COPYRIGHT
      - AI_USAGE.md
      - .github/assets/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GNU probe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev linux-libc-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --release -p gauges-probe
      - run: cargo build --locked --release -p gauges-hub
      - name: Package probe
        run: tar -C target/release -czf gauges-probe-linux-x86_64.tar.gz gauges-probe
      - uses: actions/upload-artifact@v7
        with:
          name: gauges-probe-linux-x86_64
          path: gauges-probe-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - run: docker build -f probe/Dockerfile -t gauges-probe:test .
      - run: docker build -t gauges:test .

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
        env:
          DEVICES_JSON: '[{"id":"ci","name":"CI device","token":"ci-token"}]'
