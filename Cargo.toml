[workspace]
members = ["hub", "probe", "shared"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"
authors = ["Ilya Dobryakov"]
license = "WTFNMFPL"
repository = "https://github.com/fopwoc/gauges"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
